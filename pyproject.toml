[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surgiguard"
version = "0.1.0"
description = "Reliable intraoperative segmentation and risk-aware video intelligence"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Jiutao Zhou" }]
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.9",
  "pydantic>=2.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
app = ["fastapi>=0.115", "streamlit>=1.37", "uvicorn>=0.30"]
dev = ["pytest>=8.0", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"

